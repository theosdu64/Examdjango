{% extends 'base.html' %}

{% block title %}
Créer un service
{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-dark text-white">
          <h4 class="mb-0">Créer un service</h4>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
              <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
              <div class="text-danger">{{ field.errors }}</div>
              {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-dark w-100">Valider</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
